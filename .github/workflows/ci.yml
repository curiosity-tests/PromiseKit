name: CI

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  workflow_call:
  pull_request:
    paths:
      - Sources/**
      - Tests/**
      - .github/workflows/ci.yml
      - PromiseKit.xcodeproj/**

concurrency:
  group: ${{ github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  linux-build:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        swift:
        - '4.0'
        - '4.1'
        - '4.2'
    container:
      image: swift:${{ matrix.swift }}
    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
        elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
        elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
        elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
        fi

    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - run: swift build -Xswiftc -warnings-as-errors -Xswiftc -swift-version -Xswiftc 3
    - run: swift build  # can’t test ∵ generated linuxmain requires Swift 5

  linux-test:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        swift:
        - '5.0'
        - '5.1'
        - '5.2'
        - '5.3'
        - '5.4'
        - '5.5'
        - '5.6'
        - '5.7'
        - '5.8'
        - '5.9'
        - '5.10'
        - '6.0'
    container:
      image: swift:${{ matrix.swift }}
    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
        elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
        elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
        elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
        fi

    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - run: swift build -Xswiftc -warnings-as-errors -Xswiftc -swift-version -Xswiftc 4
      if: ${{ matrix.swift < 6 }}
    - run: swift build -Xswiftc -warnings-as-errors -Xswiftc -swift-version -Xswiftc 4.2
      if: ${{ matrix.swift < 6 }}
    - run: swift test --enable-code-coverage --parallel

    - name: Generate Coverage Report
      if: ${{ matrix.swift >= 6 }}
      run: |
        apt-get -qq update
        apt-get -qq install llvm-18 curl
        export b=$(swift build --show-bin-path) && llvm-cov-18 \
          export -format lcov \
          -instr-profile=$b/codecov/default.profdata \
          --ignore-filename-regex='\.build/' \
          $b/*.xctest \
          > info.lcov

    - uses: codecov/codecov-action@v1
      with:
        file: ./info.lcov
      if: ${{ matrix.swift >= 6 }}

  test-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - uses: skiptools/swift-android-action@v2
