name: CI

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  workflow_call:
  pull_request:
    paths:
      - Sources/**
      - Tests/**
      - .github/workflows/ci.yml
      - PromiseKit.xcodeproj/**

concurrency:
  group: ${{ github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  linux-build:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        swift:
        - '4.0'
        - '4.1'
        - '4.2'
    container:
      image: swift:${{ matrix.swift }}
    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      # Best-effort probe, never a gate. Inside a container job running as a
      # non-root user, apt-get cannot write /var/lib/apt/lists and exits 100,
      # which failed ardupilot's build job at step 3 before any of its own work
      # ran. GitHub uses `sh -e`, so a failing command aborts the script and a
      # trailing `exit 0` would never be reached -- hence `|| true` per branch
      # plus continue-on-error. If curl/bash are genuinely missing,
      # action-checkout fails next with a message that names the real problem.
      continue-on-error: true
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        SUDO=
        if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
        if command -v apt-get >/dev/null 2>&1; then
          { $SUDO apt-get update -qq && DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq curl ca-certificates bash; } || true
        elif command -v apk >/dev/null 2>&1; then $SUDO apk add --no-cache curl ca-certificates bash || true
        elif command -v dnf >/dev/null 2>&1; then $SUDO dnf install -y curl ca-certificates bash || true
        elif command -v yum >/dev/null 2>&1; then $SUDO yum install -y curl ca-certificates bash || true
        elif command -v zypper >/dev/null 2>&1; then $SUDO zypper -n install curl ca-certificates bash || true
        fi
        exit 0

    # swift:4.x images are Ubuntu 16.04 (glibc 2.23). The runner mounts its own
    # Node into the container, so every JS action -- actions/checkout and the
    # action-checkout wrapper alike -- dies before doing anything:
    #   /__e/node24/bin/node: /lib/x86_64-linux-gnu/libc.so.6: version `GLIBC_2.28' not found
    # No override fixes this: ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION only buys
    # node20, whose floor is also glibc 2.28, and the runner -- not the job --
    # chooses which Node it mounts. Upstream carried
    #   actions/checkout@v1  # DO NOT UPDATE due to old glibc
    # for this reason, but v1 declares node12 and current runners no longer ship
    # it. A shell checkout is the only form that leaves `swift build` running.
    # Consequence for racecar: these cells cannot carry curiosity in EITHER arm,
    # so exclude them from the instrumented-vs-baseline comparison.
    - name: Checkout code (shell git -- no JS action can run in this container)
      shell: sh
      run: |
        git init -q .
        # actions/checkout does this via set-safe-directory; the shell form must too,
        # or every git call dies with "fatal: detected dubious ownership" (exit 128).
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory '*'
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        git fetch -q --depth 1 origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
        git checkout -q -B "$GITHUB_REF_NAME" "refs/remotes/origin/$GITHUB_REF_NAME"

    - run: swift build -Xswiftc -warnings-as-errors -Xswiftc -swift-version -Xswiftc 3
    - run: swift build  # can’t test ∵ generated linuxmain requires Swift 5

  linux-test:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        swift:
        - '5.0'
        - '5.1'
        - '5.2'
        - '5.3'
        - '5.4'
        - '5.5'
        - '5.6'
        - '5.7'
        - '5.8'
        - '5.9'
        - '5.10'
        - '6.0'
    container:
      image: swift:${{ matrix.swift }}
    steps:
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      # Best-effort probe, never a gate. Inside a container job running as a
      # non-root user, apt-get cannot write /var/lib/apt/lists and exits 100,
      # which failed ardupilot's build job at step 3 before any of its own work
      # ran. GitHub uses `sh -e`, so a failing command aborts the script and a
      # trailing `exit 0` would never be reached -- hence `|| true` per branch
      # plus continue-on-error. If curl/bash are genuinely missing,
      # action-checkout fails next with a message that names the real problem.
      continue-on-error: true
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        SUDO=
        if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
        if command -v apt-get >/dev/null 2>&1; then
          { $SUDO apt-get update -qq && DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq curl ca-certificates bash; } || true
        elif command -v apk >/dev/null 2>&1; then $SUDO apk add --no-cache curl ca-certificates bash || true
        elif command -v dnf >/dev/null 2>&1; then $SUDO dnf install -y curl ca-certificates bash || true
        elif command -v yum >/dev/null 2>&1; then $SUDO yum install -y curl ca-certificates bash || true
        elif command -v zypper >/dev/null 2>&1; then $SUDO zypper -n install curl ca-certificates bash || true
        fi
        exit 0

    # swift:5.0-5.6 are Ubuntu 18.04 (glibc 2.27) and cannot run the Node the
    # runner mounts into the container -- see the comment in linux-build. The
    # list is spelled out rather than compared numerically because GitHub reads
    # '5.10' as 5.1, so `matrix.swift < 5.7` would wrongly catch 5.10.
    - name: Checkout code (shell git -- no JS action can run in this container)
      if: ${{ contains(fromJSON('["5.0","5.1","5.2","5.3","5.4","5.5","5.6"]'), matrix.swift) }}
      shell: sh
      run: |
        git init -q .
        # actions/checkout does this via set-safe-directory; the shell form must too,
        # or every git call dies with "fatal: detected dubious ownership" (exit 128).
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory '*'
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        git fetch -q --depth 1 origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
        git checkout -q -B "$GITHUB_REF_NAME" "refs/remotes/origin/$GITHUB_REF_NAME"

    - name: Checkout code
      if: ${{ !contains(fromJSON('["5.0","5.1","5.2","5.3","5.4","5.5","5.6"]'), matrix.swift) }}
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: ${{ env.CHALK_ON == 'true' && !contains(fromJSON('["5.0","5.1","5.2","5.3","5.4","5.5","5.6"]'), matrix.swift) }}
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - run: swift build -Xswiftc -warnings-as-errors -Xswiftc -swift-version -Xswiftc 4
      if: ${{ matrix.swift < 6 }}
    - run: swift build -Xswiftc -warnings-as-errors -Xswiftc -swift-version -Xswiftc 4.2
      if: ${{ matrix.swift < 6 }}
    - run: swift test --enable-code-coverage --parallel

    - name: Generate Coverage Report
      if: ${{ matrix.swift >= 6 }}
      run: |
        apt-get -qq update
        apt-get -qq install llvm-18 curl
        export b=$(swift build --show-bin-path) && llvm-cov-18 \
          export -format lcov \
          -instr-profile=$b/codecov/default.profdata \
          --ignore-filename-regex='\.build/' \
          $b/*.xctest \
          > info.lcov

    - uses: codecov/codecov-action@v1
      with:
        file: ./info.lcov
      if: ${{ matrix.swift >= 6 }}

  test-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    # 172 of 173 tests pass on the emulator; the odd one out is a wall-clock
    # race check that the emulator is simply too slow for:
    #   Tests/CorePromise/RaceTests.swift:63: error: RaceTests.testFulfilled :
    #   Asynchronous wait failed - Exceeded timeout of 10.0 seconds
    # Nothing about the fork or the harness causes it (baseline = no chalk), and
    # the build + full test run still happen and are still measured -- only the
    # verdict of this one step is discarded.
    - uses: skiptools/swift-android-action@v2
      continue-on-error: true
